{% extends "base.html" %}
{% set active_page = 'student' %}
{% block title %}Student Login – CertifyMe{% endblock %}

{% block main %}
<div class="container-xl d-flex justify-content-center" style="min-height:70vh;">
  <div class="align-self-center w-100" style="max-width:420px">

    <div class="text-center mb-4">
      <div class="page-kicker mb-1">Student portal</div>
      <h1 class="page-title mb-2">Student login</h1>
      <p class="page-subtitle mx-auto mb-0">
        Sign in to see all certificates issued to you and open secure public links.
      </p>
    </div>

    <div class="card-soft">
      <form method="post">
        <div class="mb-3">
          <label class="field-label">Email</label>
          <input class="form-control" name="email" type="email" required placeholder="student@example.com">
        </div>

        <div class="mb-3">
          <label class="field-label">Password</label>
          <div class="password-toggle-group">
            <input class="form-control password-toggle-input" name="password" type="password" required
              placeholder="Enter password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"
              aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg></button>
          </div>
        </div>

        <button class="btn btn-primary-pill w-100 mt-2" type="submit">
          Log in as student
        </button>
      </form>

      <div class="mt-3 small-muted text-center">
        New student?
        <a href="{{ url_for('student_register') }}">Create a student account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
