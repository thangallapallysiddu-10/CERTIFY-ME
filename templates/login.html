{% extends "base.html" %}
{% set active_page = 'teacher' %}
{% block title %}Teacher Login – CertifyMe{% endblock %}

{% block main %}



<div class="container-xl d-flex justify-content-center" style="min-height:70vh;">
  <div class="align-self-center w-100" style="max-width: 420px;">

    <div class="text-center mb-3">
      <div class="page-kicker mb-1">Teacher portal</div>
      <h1 class="page-title mb-1">Welcome back</h1>
      <p class="page-subtitle mx-auto mb-0">
        Log in to issue certificates, manage batches and track verification activity.
      </p>
    </div>

    <div class="card-soft">
      <form method="post" action="{{ url_for('login') }}">

        <!-- Email -->
        <div class="mb-2">
          <label class="field-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="teacher@email.com" required>
        </div>

        <!-- Password with toggle -->
        <div class="mb-2">
          <label class="field-label">Password</label>
          <div class="position-relative">
            <input id="password-field" type="password" name="password" class="form-control pe-5" placeholder="••••••••"
              required>

            <button type="button" id="toggle-password" class="position-absolute" style="right:12px;top:50%;transform:translateY(-50%);
                     background:none;border:none;color:#9aa0a6;" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-primary-pill w-100 mt-3" type="submit">
          Log in as teacher
        </button>
      </form>

      <p class="small-muted text-center mt-3 mb-0">
        New here?
        <a href="{{ url_for('register') }}">Create a teacher account</a>
      </p>
    </div>

  </div>
</div>



{% endblock %}
